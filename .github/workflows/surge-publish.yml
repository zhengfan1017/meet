name: surge 发布

# surge 的浏览器登录会话只有 10 分钟有效，手工发链接总会过期。
# 这个任务常驻跑：不断开新会话、把新鲜链接写进 issue #1，你点一下登录，
# 批准之后任务自动发布 traebao-app-2.surge.sh，并把 token 缓存起来。
#
# 更省事的做法：在仓库 Settings → Secrets 里加一个 SURGE_TOKEN，
# 填 `surge token` 打印出来的 token，就完全不用再点登录链接了。
# 缓存里的 token 一旦拿到，后续发布也不再需要登录。
# 不想用 CI 的话，本地跑 `node tools/publish.cjs` 更快（token 存在 surge-token.txt）。

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/surge-auto-login.cjs'
      - '.github/workflows/surge-publish.yml'
      - 'index.html'
      - 'app.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'icons/**'

permissions:
  contents: write
  issues: write

concurrency:
  group: surge-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 surge
        run: npm install -g surge

      - name: 恢复已保存的 token
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/surge-token.txt
          key: surge-token-v2

      - name: 登录并发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURGE_DOMAIN: traebao-app-2.surge.sh
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          SURGE_TOKEN_FILE: ${{ runner.temp }}/surge-token.txt
        run: node tools/surge-auto-login.cjs

      - name: 保存 token
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/surge-token.txt
          key: surge-token-v2
