<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F1E8" />
<title>Trae宝</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <button type="button" id="openSettings" class="ghost-btn">设置</button>
    <div id="stage" class="stage"></div>
  </header>
  <main id="timeline" class="timeline"></main>
  <div id="banner" class="banner" hidden></div>
  <div id="installTip" class="install-tip" hidden></div>
  <form id="composer" class="composer">
    <textarea id="input" rows="1" placeholder="跟 Trae宝 说点什么…"></textarea>
    <button type="submit">发送</button>
  </form>
</div>

<div id="settings" class="settings" hidden>
  <div class="settings-card">
    <div class="settings-head">
      <h2>设置</h2>
      <button type="button" id="closeSettings">关闭</button>
    </div>
    <form id="settingsForm">
      <label>接入方式
        <select name="mode">
          <option value="direct">方舟直连</option>
          <option value="worker">Worker 代理</option>
        </select>
      </label>

      <div id="directBox">
        <label>接口地址<input name="endpoint" type="url" placeholder="https://ark.cn-beijing.volces.com/api/v3/chat/completions" /></label>
        <label>API Key<span class="inline"><input name="apiKey" type="password" /><button type="button" id="toggleKey">显示</button></span></label>
        <label>模型名<span class="inline"><input name="model" type="text" list="modelOptions" placeholder="doubao-seed-2-1-pro-260915" /></span>
          <span class="muted">模型 ID 要带日期后缀。不确定就别手填，点下面「自动找模型」让它自己找。</span>
        </label>
        <datalist id="modelOptions">
          <option value="doubao-seed-2-1-pro-260915"></option>
          <option value="doubao-seed-2-1-pro-260628"></option>
          <option value="doubao-seed-2-1-turbo-260628"></option>
          <option value="doubao-seed-2-1-lite-260915"></option>
          <option value="doubao-seed-2-0-lite-260428"></option>
          <option value="doubao-seed-2-0-mini-260428"></option>
        </datalist>
        <div class="btn-row">
          <button type="button" id="testConn" class="link">测试连接</button>
          <button type="button" id="autoModel" class="link">自动找模型</button>
        </div>
        <span id="modelHint" class="muted"></span>
      </div>

      <div id="workerBox" hidden>
        <label>Worker 地址<input name="workerUrl" type="url" placeholder="https://your-worker.workers.dev/v1/chat/completions" /></label>
        <label>访问令牌<input name="accessToken" type="password" /></label>
      </div>

      <h3>它记住的事</h3>
      <div id="memoryList" class="memory-list"></div>

      <button type="button" id="clearAll" class="danger">清除所有数据</button>
      <button type="button" id="repairApp" class="link">页面有问题？清缓存重载</button>
      <button type="submit" class="primary">保存</button>
    </form>
  </div>
</div>

<script>
// 注册 Service Worker。
//
// 这里用带版本号的地址（sw.js?v=10），而不是直接写 sw.js：
// 地址变了浏览器就会当成一次全新的注册去下载安装，
// 哪怕手机里装的是很老的版本，也能被换掉。
// 放在 HTML 里而不是 main.js 里，是因为 HTML 走网络优先，
// 每次拿到的都是最新的这段代码，不会被旧版 JS 挡住。
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v=10', { updateViaCache: 'none' })
      .catch(function () { /* 本地 file:// 打开时会失败，忽略 */ });
  });
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
